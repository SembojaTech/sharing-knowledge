# LocalStack for the ITE-SPA-06 SNS/SQS demo.
#
# Pinned to the 3.x community image, which runs SNS, SQS and Lambda with NO
# account or auth token (the 2026.x CLI/images require a LocalStack account).
#
#   docker compose up -d      # start
#   docker compose down       # stop + remove
#
name: ite-spa-06-demo

services:
  localstack:
    container_name: localstack
    image: localstack/localstack:3.8.1
    ports:
      - "4566:4566"            # edge port (all AWS service APIs)
    environment:
      # No SERVICES restriction: `serverless deploy` needs cloudformation, s3, iam
      # and logs in addition to sns/sqs/lambda. LocalStack starts them lazily.
      - DEBUG=0
      # NOTE: do NOT set LAMBDA_KEEPALIVE_MS=0 here. Tearing the Lambda container
      # down immediately races with CloudWatch log shipping, so the function's
      # logs never appear — which breaks the demo's Lambda activity view
      # (ite-spa-06/watch.sh) and the only proof the without-SQS path ran.
      # The default keep-warm behaviour is intentional. The container is named
      # localstack-lambda-sqs-consumer-dev-consume-<hash> and clears on `down`.
      #
      # The consumer is a ~73 MB NestJS bundle; its cold-start boot exceeds the
      # default 10s Lambda init timeout, leaving containers stuck in "Created"
      # and messages unprocessed. Give the runtime room to boot:
      - LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT=90
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"   # needed for Lambda execution
